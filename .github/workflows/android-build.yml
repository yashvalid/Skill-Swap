name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL (optional; defaults to VITE_API_URL repo variable or Android emulator 10.0.2.2:9000)'
        required: false
        type: string
      socket_url:
        description: 'Socket.IO URL (optional; defaults to api_url or VITE_SOCKET_URL)'
        required: false
        type: string
  push:
    branches: [main, master, dev]
    paths:
      - 'Frontend/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build web assets and sync Capacitor Android
        working-directory: Frontend
        env:
          VITE_API_URL: ${{ inputs.api_url || vars.VITE_API_URL || '' }}
          VITE_SOCKET_URL: ${{ inputs.socket_url || vars.VITE_SOCKET_URL || inputs.api_url || vars.VITE_API_URL || '' }}
        run: npm run cap:sync

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Build installable Android APK
        working-directory: Frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillswap-android-apk
          path: Frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
